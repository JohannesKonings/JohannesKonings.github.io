<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">Stage databases on the shared Aurora cluster</title>
  <desc id="desc">The shared Aurora cluster holds the maintenance database tanstackaws plus one database per stage. A permanent stage database stays when its stack is deleted. The ephemeral example feature_checkout is dropped with its stack. Each stage database contains schema default.</desc>
  <rect width="880" height="520" rx="16" fill="#f6f4ef"/>
  <rect x="16" y="16" width="848" height="488" rx="14" fill="#ffffff" stroke="#e4dfd6"/>
  <text x="40" y="48" fill="#bf4520" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1.6">ACCOUNT CLUSTER</text>
  <text x="40" y="78" fill="#2d3142" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600">Shared Aurora, Data API only</text>
  <rect x="40" y="100" width="800" height="92" rx="12" fill="#fbf7f4" stroke="#bf4520"/>
  <text x="60" y="128" fill="#bf4520" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1.4">MAINTENANCE DATABASE</text>
  <text x="60" y="156" fill="#2d3142" font-family="ui-monospace, monospace" font-size="18" font-weight="600">tanstackaws</text>
  <text x="250" y="156" fill="#4f5d75" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">no person tables. CREATE and DROP run here</text>
  <line x1="440" y1="192" x2="440" y2="228" stroke="#4f5d75" stroke-width="1.5"/>
  <line x1="234" y1="228" x2="646" y2="228" stroke="#4f5d75" stroke-width="1.5"/>
  <line x1="234" y1="228" x2="234" y2="258" stroke="#4f5d75" stroke-width="1.5"/>
  <line x1="646" y1="228" x2="646" y2="258" stroke="#bf4520" stroke-width="1.5"/>
  <polygon points="228,258 240,258 234,266" fill="#4f5d75"/>
  <polygon points="640,258 652,258 646,266" fill="#bf4520"/>
  <text x="168" y="248" fill="#4f5d75" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">CREATE</text>
  <text x="548" y="248" fill="#bf4520" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">CREATE / DROP</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="40" y="274" width="388" height="196" rx="12" fill="#ffffff" stroke="#e4dfd6"/>
    <text x="60" y="304" fill="#4f5d75" font-size="12" font-weight="600" letter-spacing="1.2">PERMANENT STAGE</text>
    <text x="60" y="336" fill="#2d3142" font-size="18" font-weight="600">stage database</text>
    <rect x="60" y="356" width="348" height="64" rx="8" fill="#f6f4ef"/>
    <text x="76" y="382" fill="#4f5d75" font-size="12">schema</text>
    <text x="76" y="404" fill="#2d3142" font-family="ui-monospace, monospace" font-size="16">default</text>
    <text x="60" y="448" fill="#4f5d75" font-size="13">stays after the stack is deleted</text>
    <rect x="452" y="274" width="388" height="196" rx="12" fill="#fff8f5" stroke="#bf4520"/>
    <text x="472" y="304" fill="#bf4520" font-size="12" font-weight="600" letter-spacing="1.2">EPHEMERAL STAGE</text>
    <text x="472" y="336" fill="#2d3142" font-family="ui-monospace, monospace" font-size="18" font-weight="600">feature_checkout</text>
    <rect x="472" y="356" width="348" height="64" rx="8" fill="#ffffff"/>
    <text x="488" y="382" fill="#4f5d75" font-size="12">schema</text>
    <text x="488" y="404" fill="#2d3142" font-family="ui-monospace, monospace" font-size="16">default</text>
    <text x="472" y="448" fill="#bf4520" font-size="13">dropped with the feature stack</text>
  </g>
</svg>
