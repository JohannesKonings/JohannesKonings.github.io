<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-labelledby="title desc">
  <title id="title">Drizzle migrations generated once and applied three ways</title>
  <desc id="desc">person-schema.ts is generated into a migrations folder. That SQL is applied by drizzle-kit migrate when the stage database already exists, by workload deploy after CREATE DATABASE, and by the local create command. Drizzle Studio reads the stage database through the Data API.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#4f5d75"/>
    </marker>
  </defs>
  <rect width="880" height="560" rx="16" fill="#f6f4ef"/>
  <rect x="16" y="16" width="848" height="528" rx="14" fill="#ffffff" stroke="#e4dfd6"/>
  <text x="40" y="50" fill="#bf4520" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1.6">MIGRATIONS</text>
  <text x="40" y="80" fill="#2d3142" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600">Generate once, apply three ways</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="40" y="104" width="244" height="72" rx="10" fill="#f6f4ef" stroke="#e4dfd6"/>
    <text x="56" y="134" fill="#4f5d75" font-size="12">schema source</text>
    <text x="56" y="156" fill="#2d3142" font-family="ui-monospace, monospace" font-size="14">person-schema.ts</text>
    <line x1="292" y1="140" x2="308" y2="140" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="318" y="104" width="244" height="72" rx="10" fill="#f6f4ef" stroke="#e4dfd6"/>
    <text x="334" y="134" fill="#4f5d75" font-size="12">drizzle-kit generate</text>
    <text x="334" y="156" fill="#2d3142" font-size="14">one folder per change</text>
    <line x1="570" y1="140" x2="586" y2="140" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="596" y="104" width="244" height="72" rx="10" fill="#fbf7f4" stroke="#bf4520"/>
    <text x="612" y="134" fill="#4f5d75" font-size="12">packages/aurora/migrations</text>
    <text x="612" y="156" fill="#2d3142" font-family="ui-monospace, monospace" font-size="14">migration.sql</text>
    <line x1="162" y1="216" x2="718" y2="216" stroke="#4f5d75" stroke-width="1.5"/>
    <line x1="718" y1="176" x2="718" y2="248" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="162" y1="216" x2="162" y2="248" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="440" y1="216" x2="440" y2="248" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="40" y="256" width="244" height="168" rx="12" fill="#ffffff" stroke="#e4dfd6"/>
    <text x="56" y="286" fill="#2d3142" font-size="15" font-weight="600">drizzle-kit migrate</text>
    <text x="56" y="318" fill="#4f5d75" font-size="13">Applies pending SQL</text>
    <text x="56" y="338" fill="#4f5d75" font-size="13">with Drizzle Kit.</text>
    <text x="56" y="374" fill="#2d3142" font-size="13">The stage database</text>
    <text x="56" y="394" fill="#2d3142" font-size="13">must already exist.</text>
    <rect x="318" y="256" width="244" height="168" rx="12" fill="#ffffff" stroke="#2d3142"/>
    <text x="334" y="286" fill="#2d3142" font-size="15" font-weight="600">Workload deploy</text>
    <text x="334" y="318" fill="#4f5d75" font-size="13">CREATE DATABASE,</text>
    <text x="334" y="338" fill="#4f5d75" font-size="13">then migrate().</text>
    <text x="334" y="374" fill="#2d3142" font-size="13">New migration.sql</text>
    <text x="334" y="394" fill="#2d3142" font-size="13">runs the handler again.</text>
    <rect x="596" y="256" width="244" height="168" rx="12" fill="#ffffff" stroke="#e4dfd6"/>
    <text x="612" y="286" fill="#2d3142" font-size="15" font-weight="600">Local create</text>
    <text x="612" y="318" fill="#4f5d75" font-size="13">Same create path</text>
    <text x="612" y="338" fill="#4f5d75" font-size="13">as deploy.</text>
    <text x="612" y="374" fill="#2d3142" font-size="13">Creates when missing.</text>
    <text x="612" y="394" fill="#2d3142" font-size="13">Never drops.</text>
    <rect x="40" y="444" width="800" height="76" rx="12" fill="#f6f4ef"/>
    <text x="56" y="474" fill="#2d3142" font-size="15" font-weight="600">drizzle-kit studio</text>
    <text x="56" y="498" fill="#4f5d75" font-size="13">Reads that stage database through the Data API.</text>
  </g>
</svg>
